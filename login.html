<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 한옥담 HANOKDAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2320; --ink-soft:#5a4f47; --cream:#f6f0e6; --cream-deep:#ede2d0; --paper:#fffaf2;
    --gold:#c9a15a; --gold-deep:#a9813e; --green:#5c6b4a; --green-deep:#41492f; --green-light:#e6ebdd;
    --white:#ffffff; --line:#e2d6c0; --slot-bg:#e9ddc8; --slot-line:#c7b491; --radius:16px; --red:#b6493a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR', sans-serif;color:var(--ink);background:var(--cream);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,.serif{font-family:'Noto Serif KR', serif;}
  a{text-decoration:none;color:inherit;}
  img,svg{display:block;}
  button{font-family:inherit;}
  .container{max-width:1180px;margin:0 auto;padding:0 32px;}
  .eyebrow{letter-spacing:.16em;font-size:12px;color:var(--gold-deep);font-weight:600;text-transform:uppercase;}

  .btn-primary{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s ease;white-space:nowrap;border:1px solid var(--ink);background:var(--ink);color:var(--paper);}
  .btn-primary:hover{background:var(--green-deep);border-color:var(--green-deep);}
  .btn-primary:disabled{opacity:.55;cursor:default;}

  /* ---------- HEADER ---------- */
  header.nav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
  .nav-inner{max-width:1180px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
  nav.menu{display:flex;gap:30px;font-size:13.5px;font-weight:500;}
  .logo-center{text-align:center;}
  .logo-center .kr{font-family:'Noto Serif KR',serif;font-weight:700;font-size:24px;}
  .logo-center .en{font-size:9px;letter-spacing:.3em;color:var(--gold-deep);}
  .nav-right{display:flex;gap:18px;font-size:12.5px;color:var(--ink-soft);align-items:center;}
  .nav-right a.active{color:var(--gold-deep);font-weight:700;}
  .nav-right a:hover{opacity:.7;text-decoration:underline;}
  .nav-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;}
  .nav-toggle span{width:20px;height:2px;background:var(--ink);display:block;}
  .mobile-menu{display:none;flex-direction:column;background:var(--paper);border-top:1px solid var(--line);padding:8px 32px 16px;}
  .mobile-menu a{padding:11px 0;font-size:14px;border-bottom:1px solid var(--line);}
  .mobile-menu.open{display:flex;}
  @media(max-width:900px){
    nav.menu{display:none;}
    .nav-right > a{display:none;}
    .nav-toggle{display:flex;}
  }

  /* ---------- AUTH LAYOUT ---------- */
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px;}
  .auth-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:40px 34px;box-shadow:0 12px 34px rgba(43,35,32,.06);}
  .auth-card h1{font-size:23px;text-align:center;margin:10px 0 6px;}
  .auth-card .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--white);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--gold-deep);}
  .row-between{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin:2px 0 22px;}
  .row-between label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .row-between a{color:var(--gold-deep);}
  .error-msg{color:var(--red);font-size:12.5px;margin:-8px 0 14px;min-height:1px;}
  .success-banner{background:var(--green-light);color:var(--green-deep);font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:20px;text-align:center;font-weight:600;}
  .divider{display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:var(--ink-soft);font-size:11.5px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .social-row{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .social-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .social-btn:hover{border-color:var(--gold-deep);}
  .toast{text-align:center;font-size:11.5px;color:var(--gold-deep);min-height:16px;margin-top:6px;}
  .bottom-line{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:22px;}
  .bottom-line a{color:var(--ink);font-weight:700;text-decoration:underline;}

  footer.site{background:#e9ddc8;color:var(--ink-soft);text-align:center;padding:22px 0;font-size:11px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <nav class="menu"><a href="about.html">한옥담소개</a><a href="products.html">제품보기</a><a href="index.html#reviews">고객센터</a></nav>
    <a href="index.html" class="logo-center"><span class="kr">한옥담</span><br><span class="en">HANOKDAM</span></a>
    <div class="nav-right">
      <a href="login.html" class="active">로그인</a><a href="signup.html">회원가입</a><a href="mypage.html">마이페이지</a>
      <button class="nav-toggle" id="navToggle" aria-label="메뉴"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="products.html">제품보기</a><a href="about.html">한옥담소개</a><a href="index.html#reviews">고객센터</a><a href="login.html">로그인</a><a href="signup.html">회원가입</a><a href="mypage.html">마이페이지</a>
  </div>
</header>

<main>
  <div class="auth-card">
    <p class="eyebrow" style="text-align:center;">HANOKDAM</p>
    <h1>로그인</h1>
    <p class="sub">한옥담에 오신 것을 환영합니다</p>

    <div class="success-banner" id="successBanner" hidden>회원가입이 완료되었습니다. 로그인해주세요 :)</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <p class="error-msg" id="errorMsg"></p>
      <div class="row-between">
        <label><input type="checkbox" id="keep"> 로그인 상태 유지</label>
        <a href="#">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">로그인</button>
    </form>

    <div class="divider">또는</div>
    <div class="social-row">
      <button type="button" class="social-btn" data-name="카카오">카카오로 로그인</button>
      <button type="button" class="social-btn" data-name="네이버">네이버로 로그인</button>
      <button type="button" class="social-btn" data-name="Google">Google로 로그인</button>
    </div>
    <p class="toast" id="toast"></p>

    <p class="bottom-line">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
  </div>
</main>

<footer class="site">© 2026 HANOKDAM. All Rights Reserved.</footer>

<script>
  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('mobileMenu').classList.toggle('open');
  });

  if (new URLSearchParams(location.search).get('joined') === '1') {
    document.getElementById('successBanner').hidden = false;
  }

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !email.includes('@')){
      errorMsg.textContent = '올바른 이메일 주소를 입력해주세요.';
      return;
    }
    if(!password){
      errorMsg.textContent = '비밀번호를 입력해주세요.';
      return;
    }
    errorMsg.textContent = '';
    // 이 목업에는 실제 서버 인증이 연결되어 있지 않아, 입력값 확인 후 마이페이지로 이동합니다.
    window.location.href = 'mypage.html';
  });

  const toast = document.getElementById('toast');
  document.querySelectorAll('.social-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      toast.textContent = btn.dataset.name + ' 로그인은 아직 준비 중입니다.';
      setTimeout(() => { toast.textContent = ''; }, 2200);
    });
  });
</script>
</body>
</html>
